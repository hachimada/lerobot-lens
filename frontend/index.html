<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d11" />
    <title>LeRobot Lens</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b0d11'/%3E%3Crect x='6' y='9' width='3' height='9' rx='1.5' fill='%23e9ebef' transform='rotate(-20 7.5 13.5)'/%3E%3Crect x='10.5' y='5' width='3' height='14' rx='1.5' fill='%23ff7247'/%3E%3Crect x='15' y='8' width='3' height='10' rx='1.5' fill='%23e9ebef' transform='rotate(20 16.5 13)'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a light/dark flash.
      try {
        const saved = localStorage.getItem('lerobot-lens.theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
