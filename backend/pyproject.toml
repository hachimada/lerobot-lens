[project]
name = "lerobot-lens"
version = "0.1.0"
description = "Inspect LeRobot policy action chunks against recorded datasets"
readme = { text = "LeRobot Lens FastAPI backend for local LeRobot dataset and policy inspection.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.0,<1",
  "lerobot[all]>=0.6.0,<0.7",
  "numpy>=1.26,<3",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "torch>=2.2",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.7.0",
  "mypy>=2.3.0",
  "pytest>=8.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_lens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "--cov=lerobot_lens",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=95",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["lerobot.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
